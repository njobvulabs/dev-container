name: Validate templates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck

      - name: Validate repository structure and JSON
        run: ./scripts/validate-repo.sh

      - name: Run repository helper tests
        run: ./tests/run-tests.sh

      - name: ShellCheck scripts
        run: shellcheck -x scripts/*.sh templates/*/.devcontainer/*.sh tests/*.sh

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
